<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <div class="display-panel">
        <p class="running-total-label" aria-live="polite">
          Total <span id="running-total" data-testid="running-total">0</span>
        </p>
        <output
          id="display"
          class="display"
          data-testid="display"
          for="keys"
          aria-live="polite"
          >0</output
        >
      </div>
      <div id="keys" class="keys" role="group" aria-label="Calculator keys">
        <button type="button" class="key key-fn" data-action="clear" data-testid="key-clear">
          AC
        </button>
        <button type="button" class="key key-fn" disabled aria-hidden="true"></button>
        <button type="button" class="key key-fn" disabled aria-hidden="true"></button>
        <button type="button" class="key key-op" data-action="add" data-testid="key-add">
          +
        </button>

        <button type="button" class="key" data-digit="7">7</button>
        <button type="button" class="key" data-digit="8">8</button>
        <button type="button" class="key" data-digit="9">9</button>
        <button type="button" class="key key-op" data-action="add" aria-label="Add">
          +
        </button>

        <button type="button" class="key" data-digit="4">4</button>
        <button type="button" class="key" data-digit="5">5</button>
        <button type="button" class="key" data-digit="6">6</button>
        <button type="button" class="key key-op" data-action="add" aria-label="Add">
          +
        </button>

        <button type="button" class="key" data-digit="1">1</button>
        <button type="button" class="key" data-digit="2">2</button>
        <button type="button" class="key" data-digit="3">3</button>
        <button type="button" class="key key-op" data-action="add" aria-label="Add">
          +
        </button>

        <button type="button" class="key key-zero" data-digit="0">0</button>
        <button type="button" class="key" data-digit=".">.</button>
        <button type="button" class="key key-op" data-action="equals" data-testid="key-equals">
          =
        </button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
