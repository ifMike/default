<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="calculator" aria-label="Calculator">
        <div class="display-wrap">
          <div class="display-label">Total</div>
          <output class="display" data-display data-testid="display" aria-live="polite">0</output>
        </div>
        <div class="keypad" role="group" aria-label="Keypad">
          <button type="button" class="key key-fn" data-action="clear" data-testid="clear">AC</button>
          <button type="button" class="key key-fn" disabled aria-hidden="true"></button>
          <button type="button" class="key key-fn" disabled aria-hidden="true"></button>
          <button type="button" class="key key-op" data-action="add" data-testid="add">+</button>

          <button type="button" class="key" data-action="digit" data-digit="7">7</button>
          <button type="button" class="key" data-action="digit" data-digit="8">8</button>
          <button type="button" class="key" data-action="digit" data-digit="9">9</button>
          <button type="button" class="key key-equals" data-action="equals" data-testid="equals">=</button>

          <button type="button" class="key" data-action="digit" data-digit="4">4</button>
          <button type="button" class="key" data-action="digit" data-digit="5">5</button>
          <button type="button" class="key" data-action="digit" data-digit="6">6</button>
          <button type="button" class="key key-span" disabled aria-hidden="true"></button>

          <button type="button" class="key" data-action="digit" data-digit="1">1</button>
          <button type="button" class="key" data-action="digit" data-digit="2">2</button>
          <button type="button" class="key" data-action="digit" data-digit="3">3</button>
          <button type="button" class="key key-span" disabled aria-hidden="true"></button>

          <button type="button" class="key key-zero" data-action="digit" data-digit="0">0</button>
          <button type="button" class="key" data-action="digit" data-digit=".">.</button>
          <button type="button" class="key key-span" disabled aria-hidden="true"></button>
          <button type="button" class="key key-span" disabled aria-hidden="true"></button>
        </div>
      </div>
    </main>
  </body>
</html>
