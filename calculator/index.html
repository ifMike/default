<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <div class="display-wrap">
        <div id="display" class="display" role="status" aria-live="polite" aria-atomic="true">
          0
        </div>
      </div>
      <div id="keys" class="keys">
        <button type="button" class="key key--function key--span-3" data-action="clear" aria-label="Clear">
          AC
        </button>
        <button type="button" class="key key--operator" data-action="add" aria-label="Add to total">
          +
        </button>

        <button type="button" class="key key--number" data-action="digit" data-value="7">7</button>
        <button type="button" class="key key--number" data-action="digit" data-value="8">8</button>
        <button type="button" class="key key--number" data-action="digit" data-value="9">9</button>
        <span class="keys__spacer" aria-hidden="true"></span>

        <button type="button" class="key key--number" data-action="digit" data-value="4">4</button>
        <button type="button" class="key key--number" data-action="digit" data-value="5">5</button>
        <button type="button" class="key key--number" data-action="digit" data-value="6">6</button>
        <span class="keys__spacer" aria-hidden="true"></span>

        <button type="button" class="key key--number" data-action="digit" data-value="1">1</button>
        <button type="button" class="key key--number" data-action="digit" data-value="2">2</button>
        <button type="button" class="key key--number" data-action="digit" data-value="3">3</button>
        <span class="keys__spacer" aria-hidden="true"></span>

        <button type="button" class="key key--number key--wide" data-action="digit" data-value="0">
          0
        </button>
        <button type="button" class="key key--number" data-action="decimal" aria-label="Decimal">
          .
        </button>
        <button type="button" class="key key--operator" data-action="add" aria-label="Add to running total">
          =
        </button>
      </div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
